[bar]
order = ["main", "alt"]

[bar.main]
position = "top"
thickness = 36
margin_ends = 0
margin_edge = 0
padding = 26

radius = 19

widget_spacing = 24
panel_overlap = 0
background_opacity = 1

start = ["audio_visualizer", "gap", "clock"]
center = ["network", "bluetooth", "gap", "desktop", "gap", "notifications", "session"]
end = ["volume", "battery", "gap", "audio_visualizer"]

[bar.alt]
position = "right"
thickness = 54
margin_ends = 160
margin_edge = 0
padding = 22

radius = 19

widget_spacing = 24
panel_overlap = 0
background_opacity = 1

start = ["media"]
center = ["taskbar"]
end = ["tray"]
