[widget.gap]
type = "spacer"
length = 72

[widget.clock]
format = "{:%H:%M}   •   {:%d.%m.%Y}"

[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20

[widget.network]
show_label = false

[widget.bluetooth]
show_label = false

[widget.audio_visualizer]
width = 142
bands = 12
centered = true
show_when_idle = true
color_1 = "secondary"
color_2 = "primary"

[widget.desktop]
type = "taskbar"
group_by_workspace = true
workspace_label_placement = "inside"
hide_empty_workspaces = false
workspace_group_capsule = false
workspace_group_content = "dots"

occupied_color = "outline"
empty_color = "outline"

[widget.taskbar]
icon_scale = 1.8
item_spacing = 20
show_active_indicator = false
active_opacity = 1
inactive_opacity = 0.5
