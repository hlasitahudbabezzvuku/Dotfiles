###############
### Options ###
###############

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set extended-keys always

set -g mouse on
set -g status-position top

unbind C-b
set -g prefix c-space

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-window-option -g mode-keys vi

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

run "~/.config/tmux/smart-splits.tmux"


#######################
### Custom bindings ###
#######################

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind \" split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v new-window -c "#{pane_current_path}"
bind a display-popup -E -w 80% -h 80% -d "#{pane_current_path}" $SHELL

bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf


###################
### Status-line ###
###################

set -g status-interval 10
set -g status-justify absolute-centre

set-option -g status-style bg=default
set-option -g pane-active-border-style fg=colour12
set-option -g pane-border-style fg=colour4

set-option -g status-left-length 48
set-option -g status-left "#{?client_prefix,#[fg=colour1],#[fg=#f0f2f4]}#[fg=colour0]#{?client_prefix,#[bg=colour1] COMMAND,#[bg=#f0f2f4] NORMAL} #[bg=#000000]#{?client_prefix,#[fg=colour1],#[fg=#f0f2f4]}#[fg=#f0f2f4]  #S      #H  #[fg=#000000, bg=default]"
set-option -g status-right-length 48
set-option -g status-right "#[fg=#000000]#[fg=#f0f2f4, bg=#000000] --      %Y/%m/%d  #{?client_prefix,#[fg=colour1],#[fg=#f0f2f4]}#[fg=colour0]#{?client_prefix,#[bg=colour1],#[bg=#f0f2f4]}  %H:%M  #[bg=default]#{?client_prefix,#[fg=colour1],#[fg=#f0f2f4]}"

set-window-option -g window-status-current-style "default"
set-window-option -g window-status-current-format "#[fg=colour12, bold]#[fg=colour0, bg=colour12] #I #[fg=colour12, bg=#000000]#[fg=#f0f2f4]  #W #[fg=#000000, bg=default]"
set-window-option -g window-status-format "#[fg=colour4]#[fg=colour0, bg=colour4] #I #[fg=colour4, bg=#000000]#[fg=#f0f2f4]  #W #[fg=#000000, bg=default]"

